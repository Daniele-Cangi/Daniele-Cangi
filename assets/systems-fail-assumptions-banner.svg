<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Systems fail where assumptions begin.</title>
  <desc id="desc">Minimal dark editorial banner with a fractured analytical grid and the statement Systems fail where assumptions begin.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080a"/>
      <stop offset="0.58" stop-color="#070a0d"/>
      <stop offset="1" stop-color="#0b0f13"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11171c"/>
      <stop offset="1" stop-color="#080b0e"/>
    </linearGradient>
    <pattern id="grid" width="62" height="62" patternUnits="userSpaceOnUse">
      <path d="M62 0H0V62" fill="none" stroke="#aab4bd" stroke-width="0.65" opacity="0.16"/>
    </pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="12" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.65  0 0 0 0 0.7  0 0 0 0 0.75  0 0 0 .11 0"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect x="0" y="18" width="780" height="420" fill="url(#grid)" opacity="0.72"/>
  <rect width="1500" height="500" filter="url(#grain)" opacity="0.32"/>

  <path d="M1120 -20 L1008 246 L930 500 H1500 V-20 Z" fill="url(#rightPanel)" opacity="0.94"/>
  <path d="M1123 -20 L1013 246 L935 500" fill="none" stroke="#88b9d8" stroke-width="1.6" opacity="0.86"/>
  <path d="M1114 -20 L1002 241 L926 500" fill="none" stroke="#d8e8f2" stroke-width="0.55" opacity="0.18"/>

  <path d="M0 365 H891" stroke="#8db4cb" stroke-width="1" opacity="0.5"/>
  <path d="M891 365 L921 365" stroke="#8db4cb" stroke-width="1" opacity="0.17" stroke-dasharray="3 7"/>
  <g stroke="#8db4cb" stroke-width="1" opacity="0.42" fill="none">
    <path d="M920 362 l10 -5 l9 7 l8 -12 l12 5"/>
    <path d="M927 369 l8 5 l7 -3 l9 7"/>
    <path d="M936 355 l4 -8 l6 3"/>
  </g>
  <g fill="#8db4cb" opacity="0.4">
    <circle cx="922" cy="363" r="1.6"/><circle cx="934" cy="355" r="1.2"/><circle cx="946" cy="371" r="1.5"/>
    <circle cx="955" cy="358" r="1"/><circle cx="938" cy="379" r="1.1"/>
  </g>

  <g stroke="#aeb9c2" stroke-width="0.8" opacity="0.13">
    <path d="M64 78 H330"/><path d="M64 428 H430"/><path d="M64 78 V185"/>
    <path d="M330 78 V118"/><path d="M430 428 V390"/>
  </g>

  <text x="82" y="305" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="400" fill="#edf0f2" textLength="1338" lengthAdjust="spacingAndGlyphs">
    <tspan>Systems fail where </tspan><tspan fill="#83b5d8">assumptions</tspan><tspan> begin</tspan><tspan fill="#83b5d8">.</tspan>
  </text>
</svg>
