name: Stats private probe

on:
  push:
    paths:
      - ".github/workflows/stats-private-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch private-access stats cache-busted
        shell: bash
        run: |
          set -euo pipefail
          url="https://github-stats-extended.vercel.app/api?username=Daniele-Cangi&show_icons=true&theme=transparent&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&rank_icon=percentile&card_width=501"
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o stats.svg
          python - <<'PY'
          import html, re
          s = open("stats.svg", encoding="utf-8").read()
          t = html.unescape(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", s))).strip()
          keys = [
              r"Rank:\s*[^ ]+",
              r"Top\s+\d+(?:\.\d+)?%",
              r"Total Stars Earned:\s*\d+",
              r"Total Commits(?: \(last year\))?\s*:\s*\d+",
              r"Total PRs:\s*\d+",
              r"Total Issues:\s*\d+",
              r"Contributed to \(last year\):\s*\d+",
          ]
          for p in keys:
              m = re.search(p, t, re.I)
              print(m.group(0) if m else f"MISSING {p}")
          print("RAW:", t[:900])
          PY
