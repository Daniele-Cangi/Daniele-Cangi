name: Stats probe

on:
  push:
    paths:
      - ".github/workflows/stats-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch stats cards
        shell: bash
        run: |
          set -euo pipefail

          declare -A urls
          urls[baseline]="https://github-stats-extended.vercel.app/api?username=Daniele-Cangi&show_icons=true&theme=transparent&rank_icon=percentile"
          urls[all_commits]="https://github-stats-extended.vercel.app/api?username=Daniele-Cangi&show_icons=true&theme=transparent&include_all_commits=true&rank_icon=percentile"
          urls[broader_roles]="https://github-stats-extended.vercel.app/api?username=Daniele-Cangi&show_icons=true&theme=transparent&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&rank_icon=percentile"
          urls[full_public]="https://github-stats-extended.vercel.app/api?username=Daniele-Cangi&show_icons=true&theme=transparent&include_all_commits=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&rank_icon=percentile"

          for key in baseline all_commits broader_roles full_public; do
            echo "===== $key ====="
            curl -fsSL --retry 3 --retry-delay 2 "${urls[$key]}" -o "$key.svg"
            python - "$key.svg" <<'PY'
          import html
          import re
          import sys

          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          text = re.sub(r"<[^>]+>", " ", s)
          text = html.unescape(re.sub(r"\s+", " ", text)).strip()

          # Show the human-readable labels and values without dumping the whole SVG.
          patterns = [
              r"(?:Rank|Percentile|Top)\s*[: ]\s*[^ ]+",
              r"\b\d+(?:\.\d+)?%",
              r"Total Stars[^<]{0,40}",
              r"Total Commits[^<]{0,40}",
              r"Total PRs[^<]{0,40}",
              r"Total Issues[^<]{0,40}",
              r"Contributed to[^<]{0,40}",
          ]
          hits = []
          for pat in patterns:
              hits.extend(re.findall(pat, text, flags=re.I))
          print("TEXT:", text[:1200])
          print("MATCHES:", hits)
          PY
          done
